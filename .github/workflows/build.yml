name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unpack project
        run: |
          unzip -q authme-fabric-buildready.zip
          chmod +x authme-fabric/gradlew
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: authme-fabric
      - name: Build
        working-directory: authme-fabric
        run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: authme-fabric
          path: authme-fabric/build/libs/*.jar
